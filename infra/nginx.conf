# TwinLoop 本地/生产反向代理配置
# Nginx 对外监听 80；Next.js 使用 3000；FastAPI 使用 8000。

worker_processes  1;

events {
    worker_connections  1024;
}

http {
    # 这是反向代理配置，不直接托管静态文件，因此不依赖 Nginx 安装目录中的 mime.types。
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    upstream twinloop_frontend {
        server 127.0.0.1:3000;
    }

    upstream twinloop_backend {
        server 127.0.0.1:8000;
    }

    server {
        listen 80;
        server_name localhost 127.0.0.1;

        # Next.js 页面和静态资源。
        location / {
            proxy_pass http://twinloop_frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # 正式认证、知乎授权和知乎数据接口。
        location /api/ {
            proxy_pass http://twinloop_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Cookie $http_cookie;
        }

        # 画像、领域、性格、初始化和聊天组接口。
        location /v1/ {
            proxy_pass http://twinloop_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Cookie $http_cookie;
        }
    }
}
