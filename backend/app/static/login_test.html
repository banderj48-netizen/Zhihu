<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TwinLoop 登录测试</title>
<style>
  body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;max-width:720px;
       margin:48px auto;padding:0 20px;line-height:1.7;color:#1a1a1a}
  h1{font-size:22px;margin-bottom:4px}
  .sub{color:#6b7280;font-size:14px;margin-top:0}
  .btn{display:inline-block;background:#0084ff;color:#fff;padding:10px 22px;
       border:0;border-radius:6px;font-size:15px;font-weight:600;cursor:pointer}
  .btn:disabled{background:#9ca3af;cursor:not-allowed}
  .btn.ghost{background:#fff;color:#374151;border:1px solid #d1d5db}
  .row{display:flex;gap:10px;align-items:center;margin:18px 0;flex-wrap:wrap}
  pre{background:#f5f6f7;padding:14px;border-radius:6px;overflow:auto;
      font-size:13px;border:1px solid #e5e7eb}
  .card{display:flex;gap:14px;align-items:center;background:#f0f9ff;
        border:1px solid #bae6fd;border-radius:8px;padding:14px;margin:16px 0}
  .card img{width:56px;height:56px;border-radius:50%;object-fit:cover;background:#e5e7eb}
  .card .n{font-weight:600;font-size:16px}
  .card .h{color:#6b7280;font-size:13px}
  .tag{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px}
  .ok{background:#dcfce7;color:#166534}
  .no{background:#fee2e2;color:#991b1b}
  h3{font-size:15px;margin:22px 0 8px}
</style>
</head>
<body>
<h1>TwinLoop 登录测试</h1>
<p class="sub">后端 <code id="api"></code></p>

<div class="row">
  <button class="btn" id="login">使用知乎账号登录</button>
  <button class="btn ghost" id="refresh">刷新状态</button>
  <button class="btn ghost" id="logout">退出登录</button>
</div>

<div id="profile"></div>

<h3>GET /api/v1/me</h3>
<pre id="out">点击「刷新状态」查看</pre>

<h3>知乎数据
  <button class="btn ghost" onclick="loadData('/api/v1/zhihu/contents?type=all&limit=10')">全部创作</button>
  <button class="btn ghost" onclick="loadData('/api/v1/zhihu/contents?type=answer&limit=10')">回答</button>
  <button class="btn ghost" onclick="loadData('/api/v1/zhihu/contents?type=article&limit=10')">文章</button>
  <button class="btn ghost" onclick="loadData('/api/v1/zhihu/followees?limit=10')">关注</button>
  <button class="btn ghost" onclick="loadData('/api/v1/zhihu/collections?limit=10')">近期收藏</button>
</h3>
<pre id="data">登录后点击上方按钮加载</pre>

<script>
async function loadData(path) {
  const box = document.getElementById('data');
  box.textContent = '加载中...';
  try {
    const r = await call(path);
    const j = await r.json();
    box.textContent = `HTTP ${r.status}  ${path}\n\n` + JSON.stringify(j, null, 2);
  } catch (e) {
    box.textContent = '请求失败: ' + e.message;
  }
}
</script>

<script>
const API = location.origin;
document.getElementById('api').textContent = API;

// credentials:'include' 是关键，否则浏览器不会带上 HttpOnly Cookie
const call = (path, opts = {}) =>
  fetch(API + path, { credentials: 'include', ...opts });

async function refresh() {
  const out = document.getElementById('out');
  const box = document.getElementById('profile');
  out.textContent = '请求中...';
  try {
    const r = await call('/api/v1/me');
    const j = await r.json();
    out.textContent = `HTTP ${r.status}\n\n` + JSON.stringify(j, null, 2);

    if (r.ok && j.data) {
      const z = j.data.zhihu || {};
      box.innerHTML = `
        <div class="card">
          <img src="${z.avatar_url || ''}" alt="">
          <div>
            <div class="n">${z.fullname || '(未返回昵称)'}</div>
            <div class="h">${z.headline || ''}</div>
            <div style="margin-top:6px">
              <span class="tag ok">已登录</span>
              <span class="tag ${j.data.zhihu_connected ? 'ok' : 'no'}">
                知乎${j.data.zhihu_connected ? '已连接' : '未连接'}</span>
              <span class="tag ghost" style="background:#f3f4f6;color:#374151">
                分身 ${j.data.avatar_status}</span>
            </div>
          </div>
        </div>`;
    } else {
      box.innerHTML = '<div class="card" style="background:#fef2f2;border-color:#fecaca">'
        + '<div><span class="tag no">未登录</span>'
        + '<div class="h" style="margin-top:4px">点击上方按钮开始知乎授权</div></div></div>';
    }
  } catch (e) {
    out.textContent = '请求失败: ' + e.message;
  }
}

document.getElementById('login').onclick = async (ev) => {
  const btn = ev.target;
  btn.disabled = true;
  btn.textContent = '正在获取授权地址...';
  try {
    const r = await call('/api/v1/sources/zhihu/connect', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ scopes: ['profile', 'answers'] })
    });
    const j = await r.json();
    if (j.data && j.data.authorization_url) {
      // 顶层跳转到知乎授权页，用户在知乎完成登录与确认
      location.href = j.data.authorization_url;
    } else {
      document.getElementById('out').textContent =
        `HTTP ${r.status}\n\n` + JSON.stringify(j, null, 2);
      btn.disabled = false;
      btn.textContent = '使用知乎账号登录';
    }
  } catch (e) {
    document.getElementById('out').textContent = '请求失败: ' + e.message;
    btn.disabled = false;
    btn.textContent = '使用知乎账号登录';
  }
};

document.getElementById('logout').onclick = async () => {
  await call('/api/v1/auth/logout', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: '{}'
  });
  refresh();
};

document.getElementById('refresh').onclick = refresh;
refresh();
</script>
</body>
</html>
